{% extends 'base.html' %}{% block body %}<div class="page-intro wrap"><span class="eyebrow">CHẠM ĐÚNG NGƯỜI</span><h1>Góc chọn quà</h1><p>Những gợi ý thực tế để chọn quà phù hợp với người nhận.</p></div><div class="wrap article-grid standalone">{% for p in posts %}<article class="article-tile">{% if p.cover_id and media_url(p.cover_id) %}<img class="article-cover" src="{{media_url(p.cover_id)}}" alt="{{p.title}}">{% endif %}<span class="eyebrow">GÓC CHỌN QUÀ</span><a href="/bai-viet/{{p.slug}}"><h2>{{p.title}}</h2></a><p>{{p.summary}}</p><a href="/bai-viet/{{p.slug}}" class="text-link">Đọc bài viết ↗</a></article>{% endfor %}</div>{% endblock %}
