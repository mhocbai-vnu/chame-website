{% extends 'admin/base.html' %}{% block body %}<div class="page-head"><div><span class="tiny">VẬN HÀNH</span><h1>Đơn hàng</h1></div></div><div class="panel"><form class="inline-form" method="get"><label>Mã đơn hoặc số điện thoại<input name="q" value="{{q}}"></label><label>Trạng thái<select name="status"><option value="">Tất cả</option>{% for val,txt in [('new','Mới'),('processing','Đang xử lý'),('shipped','Đang giao'),('delivered','Đã giao'),('cancelled','Đã hủy')] %}<option value="{{val}}" {% if status==val %}selected{% endif %}>{{txt}}</option>{% endfor %}</select></label><button class="primary">Lọc đơn</button></form><div class="table-scroll"><table><thead><tr><th>Mã đơn</th><th>Khách</th><th>Giá trị</th><th>COD/QR</th><th>Thanh toán</th><th>Trạng thái</th><th>Chi tiết</th></tr></thead><tbody>{% for o in orders %}<tr><td>{{o.code}}</td><td>{{o.customer_name}}<small>{{o.phone}}</small></td><td>{{money(o.total)}}</td><td>{{o.method}}</td><td>{{o.payment_status}}</td><td>{{o.status}}</td><td><a href="/quan-tri/don-hang/{{o.id}}">Mở ↗</a></td></tr>{% else %}<tr><td colspan="7">Chưa có đơn.</td></tr>{% endfor %}</tbody></table></div></div>{% endblock %}
